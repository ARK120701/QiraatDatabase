<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — US Qaris Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: var(--off-white); }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1rem;
      color: var(--green-dark);
      margin-bottom: 28px;
      text-decoration: none;
    }
    .login-logo .logo-icon {
      width: 32px; height: 32px;
      background: var(--green-dark);
      color: var(--gold);
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
    }

    .login-card h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-dark);
      margin-bottom: 4px;
    }
    .login-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .login-field { margin-bottom: 14px; text-align: left; }
    .login-field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 5px;
    }
    .login-field input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      color: var(--text-dark);
      background: var(--off-white);
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .login-field input:focus {
      outline: none;
      border-color: var(--green-mid);
      background: var(--white);
    }

    .btn-login {
      width: 100%;
      background: var(--green-mid);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      font-family: 'Lato', sans-serif;
    }
    .btn-login:hover { background: var(--green-dark); }

    .error-msg {
      display: none;
      background: #fce8e6;
      border: 1px solid #f5c6c2;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 0.82rem;
      color: #c0392b;
      margin-top: 12px;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--green-mid); }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <a href="index.html" class="login-logo">
        <div class="logo-icon">&#9632;</div>
        US Qaris Database
      </a>

      <h2>Admin Access</h2>
      <p>Enter the password to access the Chain Builder</p>

      <div class="login-field">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" />
      </div>

      <button class="btn-login" onclick="attemptLogin()">Unlock Chain Builder</button>

      <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>

      <a href="index.html" class="back-link">&#8592; Back to main site</a>

    </div>
  </div>

  <script>
    const HASH = '1fdcd51e8773bb5cd82d6dc4ae5deccd5c0b11802bab83ceb976178e39a4204c';

    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function attemptLogin() {
      const pw = document.getElementById('passwordInput').value;
      const hash = await sha256(pw);

      if (hash === HASH) {
        sessionStorage.setItem('admin_auth', 'granted');
        window.location.href = 'chain-builder.html';
      } else {
        const err = document.getElementById('errorMsg');
        err.style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }
  </script>
</body>
</html>
