    /* ── BgPattern ──────────────────────────────────────── */
    function BgPattern({ design }) {
      if (design === "none") return null;
      const s = { position: "absolute", inset: 0, width: "100%", height: "100%", pointerEvents: "none" };
      if (design === "flowers") return (
        <svg style={{ ...s, opacity: .12 }} xmlns="http://www.w3.org/2000/svg">

            {[0,1,2,3,4,5].map(i => { const a=i*60*Math.PI/180,cx=40+18*Math.cos(a),cy=40+18*Math.sin(a); return <ellipse key={i} cx={cx} cy={cy} rx="7" ry="13" transform={`rotate(${i*60},${cx},${cy})`} fill="#b45309"/>; })}
            <circle cx="40" cy="40" r="5" fill="#92400e"/><circle cx="40" cy="40" r="2" fill="#fbbf24"/>
          </pattern></defs><rect width="100%" height="100%" fill="url(#flwr)"/>
        </svg>
      );
      if (design === "stars") return (
        <svg style={{ ...s, opacity: .08 }} xmlns="http://www.w3.org/2000/svg">

          </pattern></defs><rect width="100%" height="100%" fill="url(#star)"/>
        </svg>
      );
      if (design === "arabesque") return (

            <circle cx="50" cy="50" r="4" fill="none" stroke="#92400e" strokeWidth="1"/><circle cx="50" cy="50" r="1.5" fill="#92400e"/>
          </pattern></defs><rect width="100%" height="100%" fill="url(#arab)"/>

      );

          </pattern></defs><rect width="100%" height="100%" fill="url(#vine)"/>
        </svg>
      );
      if (design === "geometric") return (
        <svg style={{ ...s, opacity: .07 }} xmlns="http://www.w3.org/2000/svg">

            <path d="M0,0 L50,0 L50,50 L0,50 Z" fill="none" stroke="#1e40af" strokeWidth=".6"/>
            <path d="M25,0 L50,25 L25,50 L0,25 Z" fill="none" stroke="#1e40af" strokeWidth=".6"/>
            <circle cx="25" cy="25" r="1.5" fill="#1e40af"/>
          </pattern></defs><rect width="100%" height="100%" fill="url(#geo)"/>
        </svg>
      );
      if (design === "dots") return (
        <svg style={{ ...s, opacity: .15 }} xmlns="http://www.w3.org/2000/svg">
          <defs><pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="12" cy="12" r="1.5" fill="#374151"/>
          </pattern></defs><rect width="100%" height="100%" fill="url(#dots)"/>
        </svg>
      );
      return null;
    }

    /* ── Corner ornament ─────────────────────────────────── */
    function CornerOrn({ color }) {
      return (
        <svg width="40" height="40" viewBox="0 0 40 40" style={{ position: "absolute", pointerEvents: "none" }}>
          <path d="M0,0 Q0,20 10,24 Q22,28 24,24 Q20,20 18,14 Q14,6 8,2 Q4,0 0,0 Z" fill={color} opacity=".14"/>
          <path d="M2,2 Q2,18 12,22" fill="none" stroke={color} strokeWidth="1" opacity=".4"/>
          <circle cx="20" cy="20" r="2.2" fill={color} opacity=".25"/>
        </svg>
      );
    }

    /* ── Labels (up to 50) ─────────────────────────────────── */
    const L50=Array.from({length:50},(_,i)=>i<26?String.fromCharCode(65+i):'A'+String.fromCharCode(65+(i-26)));

    /* ── Geometry ─────────────────────────────────────────── */
    const VW=620, BW=176, BH=62, CONN_H=44;
    // Dynamic box width: shrinks as count grows, minimum 78px
    function getBoxW(count){
      if(count<=3) return BW;
      const gap=count<=6?10:6,perLine=Math.min(count,Math.floor((VW+gap)/(78+gap)));
      return Math.max(78,Math.floor((VW-gap*(perLine-1))/perLine));
    }
    // Returns the X-center (within VW) of each narrator in a row
    function rowCenters(count){
      if(count<=3){const gap=20,tot=BW*count+gap*(count-1),l=(VW-tot)/2;return Array.from({length:count},(_,i)=>l+BW/2+i*(BW+gap));}
      const gap=count<=6?10:6,perLine=Math.min(count,Math.floor((VW+gap)/(78+gap)));
      const bw=getBoxW(count);
      const tot=bw*Math.min(count,perLine)+gap*(Math.min(count,perLine)-1),l=(VW-tot)/2;
      return Array.from({length:count},(_,i)=>{const col=i%perLine;return l+bw/2+col*(bw+gap);});
    }
    function bezier(x1,x2,h=CONN_H){const cp=h*.44;return `M ${x1} 0 C ${x1} ${cp}, ${x2} ${h-cp}, ${x2} ${h}`;}

    /* ── Edge helpers ─────────────────────────────────────── */
    const eKey=(a,b)=>`${a}|${b}`;
    const hasE=(E,a,b)=>E.has(eKey(a,b));
    const addE=(E,a,b)=>{const s=new Set(E);s.add(eKey(a,b));return s;};
    const delE=(E,a,b)=>{const s=new Set(E);s.delete(eKey(a,b));return s;};
    const togE=(E,a,b)=>hasE(E,a,b)?delE(E,a,b):addE(E,a,b);
    const tgts=(E,id)=>[...E].filter(e=>e.startsWith(`${id}|`)).map(e=>e.split("|")[1]);
    const srcs=(E,id)=>[...E].filter(e=>e.endsWith(`|${id}`)).map(e=>e.split("|")[0]);

    /* ── Build chain from template ────────────────────────── */
    function buildFromTemplate(tpl) {
      const rows=tpl.narrators.map(n=>({id:uid(),fromTemplate:true,narrators:[{id:uid(),name:n.name,role:n.role||"",color:n.color}]}));
      const blank1={id:uid(),fromTemplate:false,narrators:[{id:uid(),name:"",role:"",color:PALETTE[1]}]};
      const blank2={id:uid(),fromTemplate:false,narrators:[{id:uid(),name:"",role:"self",color:PALETTE[2]}]};
      const allRows=[...rows,blank1,blank2];
      let edges=new Set();
      for(let i=0;i<allRows.length-1;i++){const a=allRows[i].narrators[0].id,b=allRows[i+1].narrators[0].id;edges.add(eKey(a,b));}
      return{subject:tpl.field,rows:allRows,edges};
    }

    /* ── Init (blank) ─────────────────────────────────────── */
    function init(){
      const s=uid(),n=uid(),y=uid();
      return{subject:"",rows:[
        {id:uid(),fromTemplate:false,narrators:[{id:s,name:"",role:"sahabi",color:"#166534"}]},
        {id:uid(),fromTemplate:false,narrators:[{id:n,name:"",role:"",     color:"#1e40af"}]},
        {id:uid(),fromTemplate:false,narrators:[{id:y,name:"",role:"self", color:"#92400e"}]},
      ],edges:new Set([eKey(s,n),eKey(n,y)])};
    }

    /* ── Swatch ───────────────────────────────────────────── */
    function Swatch({color,onChange}){
      const[open,setOpen]=useState(false);
      return(
        <div style={{position:"relative",flexShrink:0}}>
          {open&&<div style={{position:"fixed",inset:0,zIndex:98}} onClick={()=>setOpen(false)}/>}
          <button onClick={()=>setOpen(o=>!o)} style={{width:22,height:22,borderRadius:"50%",background:color,border:"2.5px solid #fff",cursor:"pointer",padding:0,boxShadow:`0 0 0 1.5px ${color},0 1px 4px rgba(0,0,0,.18)`,position:"relative",zIndex:open?101:1}}/>
          {open&&(
            <div style={{position:"absolute",top:27,left:0,zIndex:100,background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,padding:8,boxShadow:"0 6px 24px rgba(0,0,0,.13)",display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5,width:140}}>
              {PALETTE.map(c=><button key={c} onClick={()=>{onChange(c);setOpen(false);}} style={{width:20,height:20,borderRadius:"50%",background:c,padding:0,border:c===color?"2.5px solid #111":"2px solid transparent",boxShadow:`0 0 0 1px ${c}66`,cursor:"pointer"}}/>)}
            </div>
          )}
        </div>
      );
    }

    /* ── ConnMatrix ───────────────────────────────────────── */
    function ConnMatrix({fromRow,toRow,edges,onToggle}){
      const F=fromRow.narrators,T=toRow.narrators;
      if(F.length===1&&T.length===1) return null;
      return(
        <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",background:"#fafafa",border:"1px dashed #d1d5db",borderRadius:8,padding:"7px 12px 9px",gap:5}}>
          <span style={{fontSize:9,letterSpacing:1.5,color:"#9ca3af",fontFamily:"system-ui",textTransform:"uppercase"}}>Who connects to whom?</span>
          <table style={{borderCollapse:"separate",borderSpacing:4}}>
            <thead><tr><th/>{T.map((n,ti)=><th key={n.id} style={{fontSize:10,fontWeight:700,color:n.color,textAlign:"center",fontFamily:"system-ui",paddingBottom:2}}>{T.length>1?L50[ti]:"↓"}</th>)}</tr></thead>
            <tbody>{F.map((fn,fi)=>(
              <tr key={fn.id}>
                <td style={{fontSize:10,fontWeight:700,color:fn.color,fontFamily:"system-ui",paddingRight:4,textAlign:"right"}}>{F.length>1?L50[fi]:"↑"}</td>
                {T.map(tn=>{const on=hasE(edges,fn.id,tn.id);return(
                  <td key={tn.id}><button onClick={()=>onToggle(fn.id,tn.id)} style={{width:26,height:22,borderRadius:5,cursor:"pointer",fontSize:13,border:`1.5px solid ${on?fn.color:"#e5e7eb"}`,background:on?`${fn.color}1a`:"#fff",color:on?fn.color:"#d1d5db",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>{on?"✓":"·"}</button></td>
                );})}
              </tr>
            ))}</tbody>
          </table>
        </div>
      );
    }

                {n.role==="sahabi"?"⬤ ":n.role==="anchor"?"★ ":""}{n.name}
              </div>
            ))}
            {(tpl.narrators||[]).length>5&&<div style={{fontSize:10,color:"#9ca3af",fontFamily:"system-ui",fontStyle:"italic"}}>+{tpl.narrators.length-5} more…</div>}
            {isCustom&&<div style={{fontSize:10,color:"#9ca3af",fontFamily:"system-ui",marginTop:2,fontStyle:"italic"}}>Saved {tpl.date||''}</div>}
            {!isCustom&&<div style={{fontSize:10,color:"#9ca3af",fontFamily:"system-ui",marginTop:4,fontStyle:"italic"}}>+ your links continue below ↓</div>}
          </div>
        </div>
      );
      return (
        <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",backdropFilter:"blur(3px)"}}/>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,width:"min(900px,98vw)",maxHeight:"88vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 24px 64px rgba(0,0,0,.2)",position:"relative",zIndex:1}}>
            <div style={{padding:"20px 26px 0",borderBottom:"1px solid #f3f4f6",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,flexWrap:'wrap',gap:12}}>
              <div>
                <h2 style={{margin:0,fontSize:20,fontWeight:700,color:"#111827",fontFamily:"'EB Garamond',serif"}}>Chain Templates</h2>
                <p style={{margin:"3px 0 0",fontSize:12,color:"#6b7280",fontFamily:"system-ui"}}>Choose a pre-built chain, a saved template, or one of your saved sanads.</p>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{display:'flex',border:'1px solid #e5e7eb',borderRadius:10,overflow:'hidden'}}>
                  <TabBtn id="famous" label="Famous Chains" count={TEMPLATES.length}/>
                  <div style={{width:1,background:'#e5e7eb'}}/>
                  <TabBtn id="mine" label="My Templates" count={customTemplates.length}/>
                  <div style={{width:1,background:'#e5e7eb'}}/>
                  <TabBtn id="sanads" label="My Sanads" count={savedSanads.length}/>
                </div>
                <button onClick={onClose} style={{background:"#f3f4f6",border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:18,color:"#6b7280",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
              </div>
            </div>
            {tab === 'famous' && (
              <div style={{overflowY:"auto",padding:"20px 22px 24px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:14}}>
                {TEMPLATES.map(tpl=><CardTemplate key={tpl.id} tpl={tpl} isCustom={false}/>)}
              </div>
            )}
            {tab === 'mine' && (
              <div style={{overflowY:"auto",padding:"20px 22px 24px"}}>
                {customTemplates.length===0?(
                  <div style={{textAlign:'center',padding:'70px 20px',color:'#9ca3af'}}>
                    <div style={{fontSize:36,marginBottom:14}}>⭐</div>
                    <div style={{fontSize:17,fontFamily:"'EB Garamond',serif",color:'#374151',marginBottom:8}}>No custom templates yet</div>
                    <div style={{fontSize:13,fontFamily:'system-ui',maxWidth:300,margin:'0 auto'}}>Build a chain and click <strong>⭐ Save as Template</strong> to add it here.</div>
                  </div>
                ):(
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:14}}>
                    {customTemplates.map(tpl=><CardTemplate key={tpl.id} tpl={tpl} isCustom={true}/>)}
                  </div>
                )}
              </div>
            )}
            {tab === 'sanads' && (
              <div style={{overflowY:"auto",padding:"20px 22px 24px"}}>
                {savedSanads.length===0?(
                  <div style={{textAlign:'center',padding:'70px 20px',color:'#9ca3af'}}>
                    <div style={{fontSize:42,marginBottom:14}}>📂</div>
                    <div style={{fontSize:17,fontFamily:"'EB Garamond',serif",color:'#374151',marginBottom:8}}>No saved sanads yet</div>
                    <div style={{fontSize:13,fontFamily:'system-ui',maxWidth:300,margin:'0 auto'}}>Save a chain from the builder using <strong>💾 Save Sanad</strong> and it will appear here.</div>
                  </div>

    /* ── Visual (Preview) ─────────────────────────────────── */
    function Visual({ rows, edges, subject, design, accentColor, previewRef }) {
      const cfg=DESIGNS.find(d=>d.id===design)||DESIGNS[0];
      const allahRow  ={id:"allah-row",  narrators:[{id:"__allah__",  name:"Allāh ﷻ",           role:"divine",color:"#b45309"}]};
      const lawhRow   ={id:"lawh-row",   narrators:[{id:"__lawh__",   name:"Al-Lawḥ al-Maḥfūẓ", role:"divine",color:"#b45309"}]};
      const jibRow    ={id:"jibreel-row",narrators:[{id:"__jibreel__",name:"Jibrīl عليه السلام", role:"divine",color:"#b45309"}]};
      const prophetRow={id:"prophet-row",narrators:[{id:PROPHET_ID,  name:"Prophet Muhammad",   role:"prophet",color:"#b45309"}]};
      const all=[allahRow,lawhRow,jibRow,prophetRow,...rows];
      const allE=new Set(edges);
      allE.add(eKey("__allah__","__lawh__"));
      allE.add(eKey("__lawh__","__jibreel__"));
      allE.add(eKey("__jibreel__",PROPHET_ID));
      rows[0].narrators.forEach(n=>allE.add(eKey(PROPHET_ID,n.id)));
      const FIXED=4;

      // narrator id → row index
      const narToRowIdx={};
      all.forEach((row,ri)=>row.narrators.forEach(nar=>{narToRowIdx[nar.id]=ri;}));

      // jump edges: connections spanning >1 level
      const jumpEdgeDefs=[];
      for(const e of allE){
        const[srcId,tgtId]=e.split('|');
        const sRi=narToRowIdx[srcId],tRi=narToRowIdx[tgtId];
        if(sRi!==undefined&&tRi!==undefined&&Math.abs(tRi-sRi)>1)
          jumpEdgeDefs.push({srcId,tgtId,sRi,tRi});
      }

      const narBoxRefs=useRef({});
      const outerRef=useRef(null);
      const[jumpLines,setJumpLines]=useState([]);
      const prevLinesRef=useRef([]);

      // compute jump line coordinates after every render; only setState if changed
      useEffect(()=>{
        if(jumpEdgeDefs.length===0){
          if(prevLinesRef.current.length){prevLinesRef.current=[];setJumpLines([]);}
          return;
        }
        const outer=outerRef.current; if(!outer) return;
        const oR=outer.getBoundingClientRect();
        const lines=[];
        for(const{srcId,tgtId,sRi,tRi} of jumpEdgeDefs){
          const sNi=all[sRi].narrators.findIndex(n=>n.id===srcId);
          const tNi=all[tRi].narrators.findIndex(n=>n.id===tgtId);
          if(sNi<0||tNi<0) continue;
          const sEl=narBoxRefs.current[`${sRi}-${sNi}`];
          const tEl=narBoxRefs.current[`${tRi}-${tNi}`];
          if(!sEl||!tEl) continue;
          const sR=sEl.getBoundingClientRect(),tR=tEl.getBoundingClientRect();
          lines.push({
            x1:sR.left-oR.left+sR.width/2, y1:sR.bottom-oR.top,
            x2:tR.left-oR.left+tR.width/2, y2:tR.top-oR.top,
            color:all[sRi].narrators[sNi].color||'#374151',
          });
        }
        const same=lines.length===prevLinesRef.current.length&&
          lines.every((l,i)=>{const p=prevLinesRef.current[i];return p&&Math.abs(l.x1-p.x1)<1&&Math.abs(l.y1-p.y1)<1&&Math.abs(l.x2-p.x2)<1&&Math.abs(l.y2-p.y2)<1;});
        if(!same){prevLinesRef.current=lines;setJumpLines(lines);}
      });

      return(
        <div ref={el=>{outerRef.current=el;if(previewRef)previewRef.current=el;}} style={{background:cfg.bg,position:"relative",overflow:"hidden"}}>
          <BgPattern design={design}/>
          {[[0,0,null,null,0],[0,null,0,null,90],[null,0,null,0,180],[null,null,0,0,270]].map(([t,r,b,l,rot],i)=>(
            <div key={i} style={{position:"absolute",top:t??undefined,right:r??undefined,bottom:b??undefined,left:l??undefined,transform:`rotate(${rot}deg)`,pointerEvents:"none",zIndex:1}}>
              <CornerOrn color={accentColor}/>
            </div>
          ))}
          {/* Jump-connection overlay SVG */}
          {jumpLines.length>0&&(
            <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:5,overflow:'visible'}}>
              {jumpLines.map((l,i)=>{
                const ox=Math.min(l.x1,l.x2)-68;
                return(
                  <Fragment key={i}>
                    <path d={`M ${l.x1} ${l.y1} C ${ox} ${l.y1+30}, ${ox} ${l.y2-30}, ${l.x2} ${l.y2}`}
                      fill="none" stroke={l.color} strokeWidth="2" strokeDasharray="7 4" opacity=".65" strokeLinecap="round"/>
                    <polygon points={`${l.x2},${l.y2} ${l.x2-5},${l.y2-9} ${l.x2+5},${l.y2-9}`} fill={l.color} opacity=".82"/>
                    <circle cx={l.x1} cy={l.y1} r="4" fill={l.color} opacity=".5"/>
                  </Fragment>
                );
              })}
            </svg>
          )}
          <div style={{padding:"28px 28px 38px",display:"flex",flexDirection:"column",alignItems:"center",position:"relative",zIndex:2}}>
            <div style={{textAlign:"center",width:VW,marginBottom:20}}>
              <div style={{fontSize:26,color:accentColor,letterSpacing:5,fontFamily:"'EB Garamond',serif",lineHeight:1}}>سلسلة السند</div>
              <div style={{fontSize:10,letterSpacing:4,color:"#9ca3af",fontFamily:"system-ui",textTransform:"uppercase",marginTop:5}}>Chain of Transmission</div>
              {subject&&<div style={{fontFamily:"'EB Garamond',serif",fontSize:18,color:"#1f2937",marginTop:6}}>{subject}</div>}
              <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px auto 0",maxWidth:340}}>
                <div style={{flex:1,height:1,background:accentColor,opacity:.25}}/>
                <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,1 8.7,5 13,5 9.5,7.8 10.8,12 7,9.3 3.2,12 4.5,7.8 1,5 5.3,5" fill={accentColor} opacity=".6"/></svg>
                <div style={{flex:1,height:1,background:accentColor,opacity:.25}}/>
              </div>
            </div>
            <div style={{width:VW}}>
              {all.map((row,ri)=>{
                const isDivine =["allah-row","lawh-row","jibreel-row"].includes(row.id);
                const isProphet=row.id==="prophet-row";
                const isFixed  =isDivine||isProphet;
                const isSahabi =!isFixed&&ri===FIXED;
                const isYou    =!isFixed&&ri===all.length-1;
                const isTpl    =!isFixed&&!!row.fromTemplate;
                const isAnchor =!isFixed&&row.narrators[0]?.role==="anchor";
                const count    =row.narrators.length;
                const ctrs     =rowCenters(count);
                const nextRow  =ri<all.length-1?all[ri+1]:null;
                const nCtrs    =nextRow?rowCenters(nextRow.narrators.length):[];
                const genNum   =ri-FIXED+1;
                const lines    =[];
                if(nextRow){row.narrators.forEach((fn,fi)=>nextRow.narrators.forEach((tn,ti)=>{if(allE.has(eKey(fn.id,tn.id)))lines.push({x1:ctrs[fi],x2:nCtrs[ti],color:fn.color||"#b45309"});}))}
                return(
                  <div key={row.id}>
                    {(()=>{
                      const boxW=isFixed?BW:getBoxW(count);
                      const boxGap=count<=3?20:count<=6?10:6;
                      const perLine=count<=3?count:Math.min(count,Math.floor((VW+boxGap)/(78+boxGap)));
                      const wrapStyle=count>3?{flexWrap:'wrap',justifyContent:'flex-start',gap:boxGap,maxWidth:VW}:{justifyContent:"center",gap:boxGap};
                      return(
                    <div style={{position:'relative',display:"flex",...wrapStyle}}>
                      {/* Generation counter badge */}
                      {!isFixed&&(
                        <div style={{position:'absolute',left:count>3?-4:2,top:count>3?4:'50%',transform:count>3?'none':'translateY(-50%)',zIndex:3,width:24,height:24,borderRadius:'50%',background:isSahabi?'#1e3a5f':'#374151',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontFamily:'system-ui',fontWeight:700,boxShadow:'0 2px 8px rgba(0,0,0,.22)',flexShrink:0}}>
                          {genNum}
                        </div>
                      )}
                      {row.narrators.map((nar,ni)=>{
                        const name=nar.name||(isProphet?"Prophet Muhammad ﷺ":nar.role==="sahabi"?"Companion (Ṣaḥābī)":nar.role==="self"?"Your Name":"…");
                        const arabicName=!isFixed?lookupArabic(nar.name):'';
                        const bc=isFixed?"#b45309":nar.color;
                        const isCompact=count>3;
                        return(
                          <div key={nar.id} ref={el=>narBoxRefs.current[`${ri}-${ni}`]=el}
                            style={{width:isFixed?BW:boxW,minHeight:isFixed?78:isCompact?50:BH,background:isFixed?"#fffbeb":isAnchor?`${bc}0d`:"#fff",border:`${isFixed||isAnchor?2:1.5}px solid ${bc}`,borderRadius:isFixed?14:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:isCompact?"5px 8px":"8px 14px",textAlign:"center",position:"relative",boxShadow:isFixed?`0 4px 22px ${bc}28,0 0 0 1px ${bc}22`:`0 2px 8px rgba(0,0,0,.06)`,flexShrink:0}}>
                            <div style={{position:"absolute",top:-9,left:"50%",transform:"translateX(-50%)",background:cfg.bg,border:`1.5px solid ${bc}`,borderRadius:8,padding:"1px 6px",fontSize:8,letterSpacing:.8,color:bc,whiteSpace:"nowrap",fontFamily:"system-ui",maxWidth:'90%',overflow:'hidden',textOverflow:'ellipsis'}}>
                              {row.id==="allah-row"?"الله ﷻ":row.id==="lawh-row"?"اللوح المحفوظ":row.id==="jibreel-row"?"جبريل":isProphet?"النبي ﷺ":isSahabi?`Ṣaḥābī${count>1?" · "+L50[ni]:""}`:isYou?`Student${count>1?" · "+L50[ni]:""}`:isAnchor?`Anchor${count>1?" · "+L50[ni]:""}`:isTpl?`Template${count>1?" · "+L50[ni]:""}`:count>1?L50[ni]:`Gen ${genNum}`}
                            </div>
                            {row.id==="allah-row"   &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:20,color:"#b45309",marginBottom:2}}>ﷻ</div>}
                            {row.id==="jibreel-row" &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:12,color:"#b45309",letterSpacing:2,marginBottom:3}}>عليه السلام</div>}
                            {isProphet             &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:13,color:"#b45309",letterSpacing:4,marginBottom:4}}>ﷺ   ﷺ</div>}
                            <div style={{fontFamily:"'EB Garamond',serif",fontWeight:700,fontSize:isFixed?16:14,color:isFixed?"#92400e":isYou||isAnchor?bc:"#1f2937",lineHeight:1.25}}>{name}</div>
                            {arabicName&&<div style={{fontFamily:"'EB Garamond',serif",fontSize:11,color:'#8b6a3e',marginTop:2,direction:'rtl',letterSpacing:.5,lineHeight:1.3}}>{arabicName}</div>}
                            {row.id==="allah-row"   &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:10,color:"#b45309",marginTop:2}}>تَبَارَكَ وَتَعَالَى</div>}
                            {row.id==="lawh-row"    &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:10,color:"#b45309",marginTop:2}}>The Preserved Tablet</div>}
                            {row.id==="jibreel-row" &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:10,color:"#b45309",marginTop:2}}>The Trustworthy Angel</div>}
                            {isProphet             &&<div style={{fontFamily:"'EB Garamond',serif",fontSize:10,color:"#b45309",marginTop:2}}>Muhammad ibn ʿAbdillāh</div>}
                            {isTpl&&!isAnchor&&<div style={{position:"absolute",top:3,right:4,fontSize:7,color:bc,opacity:.5,fontFamily:"system-ui"}}>⬡</div>}
                            {isAnchor            &&<div style={{position:"absolute",top:3,right:4,fontSize:7,color:bc,opacity:.7,fontFamily:"system-ui"}}>★</div>}
                          </div>
                        );
                      })}
                    </div>
                      );})()}
                    {nextRow&&(
                      <svg width={VW} height={CONN_H} viewBox={`0 0 ${VW} ${CONN_H}`} style={{display:"block"}}>
                        {lines.map((l,i)=>(
                          <Fragment key={i}>
                            <path d={bezier(l.x1,l.x2)} fill="none" stroke={l.color} strokeWidth="1.8" opacity=".6" strokeLinecap="round"/>
                            <polygon points={`${l.x2},${CONN_H} ${l.x2-4.5},${CONN_H-8} ${l.x2+4.5},${CONN_H-8}`} fill={l.color} opacity=".75"/>
                          </Fragment>
                        ))}
                      </svg>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{width:VW,marginTop:16,textAlign:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,maxWidth:340,margin:"0 auto 10px"}}>
                <div style={{flex:1,height:1,background:accentColor,opacity:.25}}/>
                <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,1 8.7,5 13,5 9.5,7.8 10.8,12 7,9.3 3.2,12 4.5,7.8 1,5 5.3,5" fill={accentColor} opacity=".6"/></svg>
                <div style={{flex:1,height:1,background:accentColor,opacity:.25}}/>
              </div>
              <div style={{fontFamily:"'EB Garamond',serif",fontSize:17,color:"#9ca3af",letterSpacing:2}}>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Jump Connection Panel ───────────────────────────── */
    function JumpConnPanel({ rows, edges, onToggle }) {
      const [fromRi, setFromRi] = useState('');
      const [toRi,   setToRi]   = useState('');

      // collect existing jump edges among user-entered rows
      const seen = new Set();
      const existing = [];
      rows.forEach((row, ri) => {
        row.narrators.forEach(nar => {
          rows.forEach((tRow, ti) => {
            if (Math.abs(ti - ri) <= 1) return;
            tRow.narrators.forEach(tNar => {
              const k = eKey(nar.id, tNar.id);
              if (edges.has(k) && !seen.has(k)) { seen.add(k); existing.push({ ri, ti, nar, tNar }); }
            });
          });
        });
      });

      const fN = +fromRi, tN = +toRi;
      const canAdd = fromRi !== '' && toRi !== '' && fN !== tN && Math.abs(fN - tN) > 1;

      const handleAdd = () => {
        if (!canAdd) return;
        const fromRow = rows[fN], toRow = rows[tN];
        if (fromRow && toRow) onToggle(fromRow.narrators[0].id, toRow.narrators[0].id);
        setFromRi(''); setToRi('');
      };

      const SEL = { border:'1.5px solid #a5b4fc',borderRadius:6,padding:'6px 9px',fontSize:12,fontFamily:"'EB Garamond',serif",color:'#374151',background:'#fff',flex:1,minWidth:110,outline:'none' };

      return (
        <div style={{marginTop:18,background:'#f5f3ff',border:'1px dashed #a5b4fc',borderRadius:10,padding:'13px 16px'}}>
          <div style={{fontSize:10,letterSpacing:2,color:'#6366f1',fontFamily:'system-ui',textTransform:'uppercase',marginBottom:7,fontWeight:700}}>⚡ Jump Connections</div>
          <div style={{fontSize:11,color:'#6b7280',fontFamily:'system-ui',marginBottom:10,lineHeight:1.5}}>Connect narrators across non-adjacent levels — e.g. a scholar who received directly from a Ṣaḥābī, bypassing intermediate links.</div>
          {existing.length > 0 && (
            <div style={{marginBottom:11,display:'flex',flexDirection:'column',gap:5}}>
              {existing.map((j, i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid #c7d2fe',borderRadius:7,padding:'6px 10px'}}>
                  <div style={{flex:1,fontSize:12.5,fontFamily:"'EB Garamond',serif",color:'#374151',lineHeight:1.3}}>
                    <span style={{fontWeight:700,color:'#6366f1'}}>Gen {j.ri+1}</span>: {j.nar.name||'(unnamed)'}
                    <span style={{color:'#6366f1',margin:'0 7px',fontSize:14}}>⚡</span>
                    <span style={{fontWeight:700,color:'#6366f1'}}>Gen {j.ti+1}</span>: {j.tNar.name||'(unnamed)'}
                  </div>
                  <button onClick={()=>onToggle(j.nar.id,j.tNar.id)} style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:5,padding:'2px 8px',fontSize:10,color:'#ef4444',cursor:'pointer',fontFamily:'system-ui',flexShrink:0}}>✕ Remove</button>
                </div>
              ))}
            </div>
          )}
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
            <select value={fromRi} onChange={e=>setFromRi(e.target.value)} style={SEL}>
              <option value="">From gen…</option>
              {rows.map((row,ri)=>(
                <option key={ri} value={ri}>Gen {ri+1}{row.narrators[0]?.name?' — '+row.narrators[0].name.slice(0,22):''}</option>
              ))}
            </select>
            <span style={{color:'#6366f1',fontSize:15,fontWeight:700,flexShrink:0}}>⚡→</span>
            <select value={toRi} onChange={e=>setToRi(e.target.value)} style={SEL}>
              <option value="">To gen…</option>
              {rows.map((row,ri)=>(
                <option key={ri} value={ri}>Gen {ri+1}{row.narrators[0]?.name?' — '+row.narrators[0].name.slice(0,22):''}</option>
              ))}
            </select>
            <button onClick={handleAdd} disabled={!canAdd} style={{padding:'7px 14px',borderRadius:6,border:'none',background:canAdd?'#6366f1':'#d1d5db',color:'#fff',cursor:canAdd?'pointer':'default',fontSize:12,fontFamily:'system-ui',fontWeight:600,flexShrink:0}}>
              Add Jump
            </button>
          </div>
          {fromRi!==''&&toRi!==''&&!canAdd&&<div style={{fontSize:10,color:'#ef4444',fontFamily:'system-ui',marginTop:4}}>Select levels that are at least 2 apart to create a jump.</div>}
        </div>
      );
    }

    /* ── Main App ─────────────────────────────────────────── */
    function App() {
      const [chain,setChain]           = useState(init);
      const [tab,setTab]               = useState("build");
      const [design,setDesign]         = useState("flowers");
      const [accent,setAccent]         = useState("#b45309");
      const [showTplModal,setTplModal] = useState(false);
      const [appliedTpl,setAppliedTpl] = useState(null);
      const [pdfStatus,setPdfStatus]   = useState("idle");
      const [showChainPreview,setShowChainPreview] = useState(false);
      const previewRef = useRef(null);

      /* new state */
      const [savedSanads,setSavedSanads]     = useState(loadSavedSanads);
      const [customTpls,setCustomTpls]       = useState(loadCustomTpls);
      const [showSaveModal,setShowSaveModal] = useState(false);
      const [showSaveTplModal,setShowSaveTpl]= useState(false);
      const [folderCat,setFolderCat]         = useState('all');
      const [saveTplDone,setSaveTplDone]     = useState(false);
      const [editingTpl,setEditingTpl]       = useState(null); // {id, name, isFamous}
      const [previewSanad,setPreviewSanad]   = useState(null);

      const upd = fn => setChain(c=>fn(c));
      const setSubject  = v       => upd(c=>({...c,subject:v}));
      const setNarName  = (ri,ni,v)=>upd(c=>({...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:r.narrators.map((n,j)=>j!==ni?n:{...n,name:v})})}));
      const setNarColor = (ri,ni,v)=>upd(c=>({...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:r.narrators.map((n,j)=>j!==ni?n:{...n,color:v})})}));

      const applyTemplate = tpl => { setChain(buildFromTemplate(tpl)); setAppliedTpl(tpl); setTplModal(false); setAccent(tpl.color); setEditingTpl(null); };
      const clearTemplate = () => { setChain(init()); setAppliedTpl(null); setEditingTpl(null); };

      const addBranch = ri=>upd(c=>{
        const row=c.rows[ri]; if(row.narrators.length>=50) return c;
        const base=row.narrators[0],newId=uid();
        let E=new Set(c.edges);
        tgts(E,base.id).forEach(t=>{E=addE(E,newId,t);});
        srcs(E,base.id).forEach(s=>{E=addE(E,s,newId);});
        const ci=(PALETTE.indexOf(row.narrators[row.narrators.length-1].color)+4)%PALETTE.length;
        return{...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:[...r.narrators,{id:newId,name:"",role:base.role,color:PALETTE[ci]}]}),edges:E};
      });
      const addMultiBranch = (ri,n)=>upd(c=>{
        const row=c.rows[ri];
        const toAdd=Math.min(n,50-row.narrators.length); if(toAdd<=0) return c;
        const base=row.narrators[0];
        let E=new Set(c.edges),lastCi=PALETTE.indexOf(row.narrators[row.narrators.length-1].color);
        const newNars=Array.from({length:toAdd},()=>{
          const newId=uid();
          tgts(E,base.id).forEach(t=>{E=addE(E,newId,t);});
          srcs(E,base.id).forEach(s=>{E=addE(E,s,newId);});
          lastCi=(lastCi+4)%PALETTE.length;
          return{id:newId,name:"",role:base.role,color:PALETTE[lastCi]};
        });
        return{...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:[...r.narrators,...newNars]}),edges:E};
      });
      const remBranch = ri=>upd(c=>{
        const row=c.rows[ri]; if(row.narrators.length<=1) return c;
        const rid=row.narrators[row.narrators.length-1].id;
        return{...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:r.narrators.slice(0,-1)}),edges:new Set([...c.edges].filter(e=>!e.startsWith(`${rid}|`)&&!e.endsWith(`|${rid}`)))};
      });
      const remBranchAt = (ri,ni)=>upd(c=>{
        const row=c.rows[ri]; if(row.narrators.length<=1) return c;
        const rid=row.narrators[ni].id;
        return{...c,rows:c.rows.map((r,i)=>i!==ri?r:{...r,narrators:r.narrators.filter((_,j)=>j!==ni)}),edges:new Set([...c.edges].filter(e=>!e.startsWith(`${rid}|`)&&!e.endsWith(`|${rid}`)))};
      });
      const addLevel = ri=>upd(c=>{
        const newId=uid();
        const prev=c.rows[ri].narrators.map(n=>n.id);
        const nxt=ri+1<c.rows.length?c.rows[ri+1].narrators.map(n=>n.id):[];
        let E=new Set(c.edges);
        prev.forEach(p=>nxt.forEach(n=>{E=delE(E,p,n);}));
        prev.forEach(p=>{E=addE(E,p,newId);}); nxt.forEach(n=>{E=addE(E,newId,n);});
        const ci=Math.floor(Math.random()*PALETTE.length);
        const rows=[...c.rows]; rows.splice(ri+1,0,{id:uid(),fromTemplate:false,narrators:[{id:newId,name:"",role:"",color:PALETTE[ci]}]});
        return{...c,rows,edges:E};
      });
      const remLevel = ri=>upd(c=>{
        if(c.rows.length<=2) return c;
        const removed=c.rows[ri].narrators.map(n=>n.id);
        let E=new Set(c.edges);
        removed.forEach(id=>{
          const ss=srcs(E,id),ts=tgts(E,id);
          ss.forEach(s=>ts.forEach(t=>{E=addE(E,s,t);}));
          E=new Set([...E].filter(e=>!e.startsWith(`${id}|`)&&!e.endsWith(`|${id}`)));
        });
        return{...c,rows:c.rows.filter((_,i)=>i!==ri),edges:E};
      });
      const togConn=(a,b)=>upd(c=>({...c,edges:togE(c.edges,a,b)}));

      /* ── Save / load sanads ── */
      const handleSaveSanad = (title, category) => {
        const entry = {
          id: Date.now().toString(),
          title, category,
          subject: chain.subject,
          rows: chain.rows,
          edges: [...chain.edges],
          design, accent,
          date: new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}),
        };
        const updated = [entry, ...savedSanads];
        setSavedSanads(updated);
        localStorage.setItem(SANADS_KEY, JSON.stringify(updated));
        setShowSaveModal(false);
        setFolderCat(category);
        setTab('sanads');
      };
      const handleDeleteSanad = id => {
        const updated = savedSanads.filter(s => s.id !== id);
        setSavedSanads(updated);
        localStorage.setItem(SANADS_KEY, JSON.stringify(updated));
      };
      const handleLoadSanad = sanad => {
        setChain({ subject: sanad.subject||'', rows: sanad.rows, edges: new Set(sanad.edges||[]) });
        if (sanad.design) setDesign(sanad.design);
        if (sanad.accent) setAccent(sanad.accent);
        setAppliedTpl(null);
        setEditingTpl(null);
        setTab('build');
      };

      /* ── Save / delete custom templates ── */
      const handleSaveCustomTpl = (name, field, badge, color, category, validRows) => {
        const narrators = validRows.map((row, i, arr) => ({
          name:  row.narrators[0].name.trim(),
          role:  row.narrators[0].role || (i===0?'sahabi': i===arr.length-1?'anchor':''),
          color,
        }));
        const entry = {
          id: `ct_${Date.now()}`,
          name, field: field||name, badge: badge||name.slice(0,8), color, category, narrators,
          date: new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}),
        };
        const updated = [entry, ...customTpls];
        setCustomTpls(updated);
        localStorage.setItem(CUSTOM_TPL_KEY, JSON.stringify(updated));
        setShowSaveTpl(false);
        setSaveTplDone(true);
        setTimeout(()=>setSaveTplDone(false), 2500);
      };
      const handleDeleteCustomTpl = id => {
        const updated = customTpls.filter(t => t.id !== id);
        setCustomTpls(updated);
        localStorage.setItem(CUSTOM_TPL_KEY, JSON.stringify(updated));
      };

      /* ── Edit template ── */
      const loadTplForEdit = tpl => {
        // Load all narrators as fully editable (no fromTemplate lock)
        const editRows = tpl.narrators.map(n => ({
          id: uid(), fromTemplate: false,
          narrators: [{ id: uid(), name: n.name, role: n.role||'', color: n.color }],
        }));
        let editEdges = new Set();
        for (let i = 0; i < editRows.length - 1; i++) {
          editEdges.add(eKey(editRows[i].narrators[0].id, editRows[i+1].narrators[0].id));
        }
        setChain({ subject: tpl.field||tpl.name||'', rows: editRows, edges: editEdges });
        setAppliedTpl(null);
        setEditingTpl({ id: tpl.id, name: tpl.name, isFamous: !String(tpl.id).startsWith('ct_') });
        setTplModal(false);
        setAccent(tpl.color||'#b45309');
        setTab('build');
      };

      const handleUpdateTpl = () => {
        if (!editingTpl || editingTpl.isFamous) return;
        const narrators = rows
          .filter(r => r.narrators[0]?.name?.trim())
          .map((row, i, arr) => ({
            name:  row.narrators[0].name.trim(),
            role:  row.narrators[0].role||(i===0?'sahabi':i===arr.length-1?'anchor':''),
            color: row.narrators[0].color,
          }));
        const updated = customTpls.map(t =>
          t.id === editingTpl.id
            ? { ...t, narrators, field: subject||t.field, date: new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) }
            : t
        );
        setCustomTpls(updated);
        localStorage.setItem(CUSTOM_TPL_KEY, JSON.stringify(updated));
        setEditingTpl(null);
        setSaveTplDone(true);
        setTimeout(()=>setSaveTplDone(false), 2500);
      };

      const downloadPDF = useCallback(async()=>{
        if(!previewRef.current) return;
        setPdfStatus("loading");
        try{
          await new Promise((res,rej)=>{if(window.html2canvas)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
          await new Promise((res,rej)=>{if(window.jspdf)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
          const canvas=await window.html2canvas(previewRef.current,{scale:2,useCORS:true,backgroundColor:null,logging:false,allowTaint:true});
          const imgData=canvas.toDataURL("image/png");
          const{jsPDF}=window.jspdf;
          const W=canvas.width/2,H=canvas.height/2;
          const pdf=new jsPDF({orientation:H>W?"portrait":"landscape",unit:"px",format:[W,H]});
          pdf.addImage(imgData,"PNG",0,0,W,H);
          pdf.save(chain.subject?`Sanad-${chain.subject.replace(/\s+/g,"-")}.pdf`:"Sanad-Chain.pdf");
          setPdfStatus("done"); setTimeout(()=>setPdfStatus("idle"),2500);
        }catch(e){console.error(e);setPdfStatus("idle");alert("PDF failed — please try again.");}
      },[chain.subject]);

      const {rows,edges,subject}=chain;
      const INP=(ex={})=>({border:"1px solid #e5e7eb",borderRadius:7,padding:"8px 11px",fontSize:15,fontFamily:"'EB Garamond',serif",outline:"none",background:"#fff",color:"#1f2937",boxSizing:"border-box",width:"100%",...ex});
      const SMBTN=(bc="#e5e7eb",tc="#6b7280",bg="#f9fafb")=>({background:bg,border:`1px solid ${bc}`,borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",color:tc,fontFamily:"system-ui",letterSpacing:.3,lineHeight:"18px"});

      const filteredSanads = folderCat==='all' ? savedSanads : savedSanads.filter(s=>s.category===folderCat);

      return (
        <div style={{minHeight:"60vh",background:"#f9fafb",fontFamily:"'EB Garamond',serif"}}>

          {/* ── Modals ── */}
          {showTplModal && <TemplateModal onSelect={applyTemplate} onClose={()=>setTplModal(false)} customTemplates={customTpls} onDeleteCustom={handleDeleteCustomTpl} onEdit={loadTplForEdit} savedSanads={savedSanads} onSelectSanad={sanad=>{handleLoadSanad(sanad);setTplModal(false);}}/>}
          {showSaveModal && <SaveSanadModal subject={subject} onSave={handleSaveSanad} onClose={()=>setShowSaveModal(false)}/>}
          {showSaveTplModal && <SaveTemplateModal rows={rows} onSave={handleSaveCustomTpl} onClose={()=>setShowSaveTpl(false)}/>}

          {/* ── Chain Preview Modal ── */}
          {showChainPreview&&(
            <div style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setShowChainPreview(false)}>
              <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(5px)'}}/>
              <div onClick={e=>e.stopPropagation()} style={{background:'#f9fafb',borderRadius:22,width:'min(700px,97vw)',maxHeight:'94vh',overflow:'hidden',display:'flex',flexDirection:'column',position:'relative',zIndex:1,boxShadow:'0 28px 80px rgba(0,0,0,.32)'}}>
                {/* Header */}
                <div style={{padding:'14px 20px',background:'#fff',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,gap:12}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:700,color:'#111827',fontFamily:"'EB Garamond',serif"}}>Chain Preview</div>
                    {subject&&<div style={{fontSize:11.5,color:'#6b7280',fontFamily:'system-ui',marginTop:1}}>{subject}</div>}
                  </div>
                  <div style={{display:'flex',gap:8,flexShrink:0}}>
                    <button onClick={downloadPDF} disabled={pdfStatus==='loading'} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,border:'none',background:pdfStatus==='done'?'#166534':pdfStatus==='loading'?'#9ca3af':'#111827',color:'#fff',cursor:pdfStatus==='loading'?'wait':'pointer',fontSize:13,fontFamily:'system-ui',fontWeight:600,transition:'background .2s'}}>
                      {pdfStatus==='loading'?<><span style={{display:'inline-block',width:12,height:12,border:'2px solid #fff',borderTopColor:'transparent',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>Generating…</>:pdfStatus==='done'?'✓ Downloaded!':<><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M7.5 10L3 5.5h3V1h3v4.5h3L7.5 10Z" fill="#fff"/><path d="M1 13h13" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>Download PDF</>}
                    </button>
                    <button onClick={()=>setShowChainPreview(false)} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:34,height:34,cursor:'pointer',fontSize:20,color:'#6b7280',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>×</button>
                  </div>
                </div>
                {/* Design / Accent quick controls */}
                <div style={{padding:'10px 18px',background:'#fff',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap',flexShrink:0}}>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                    {DESIGNS.map(d=>(
                      <button key={d.id} onClick={()=>setDesign(d.id)} style={{padding:'4px 10px',borderRadius:20,fontSize:10.5,cursor:'pointer',fontFamily:'system-ui',letterSpacing:.3,border:`1.5px solid ${design===d.id?'#111827':'#e5e7eb'}`,background:design===d.id?'#111827':d.bg,color:design===d.id?'#fff':'#374151'}}>
                        {d.label}
                      </button>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:5,flexShrink:0}}>
                    {["#b45309","#166534","#1e40af","#991b1b","#5b21b6","#374151"].map(c=>(
                      <button key={c} onClick={()=>setAccent(c)} style={{width:22,height:22,borderRadius:'50%',background:c,padding:0,cursor:'pointer',border:accent===c?'3px solid #111':'2px solid #fff',boxShadow:`0 0 0 1.5px ${c}88`}}/>
                    ))}
                  </div>
                </div>
                {/* Visual */}
                <div style={{overflowY:'auto',flex:1}}>
                  <Visual rows={rows} edges={edges} subject={subject} design={design} accentColor={accent} previewRef={previewRef}/>
                </div>
              </div>
            </div>
          )}

          {/* ── Sanad Preview Modal ── */}
          {previewSanad&&(()=>{
            const ps=previewSanad;
            const catObj=CATS.find(c=>c.id===ps.category)||CATS[CATS.length-1];
            const psEdges=new Set(ps.edges||[]);
            const psPdfRef={current:null};
            const handlePsPdf=async()=>{
              await new Promise((res,rej)=>{if(window.html2canvas)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
              await new Promise((res,rej)=>{if(window.jspdf)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
              const canvas=await window.html2canvas(psPdfRef.current,{scale:2,useCORS:true,backgroundColor:null,logging:false,allowTaint:true});
              const imgData=canvas.toDataURL("image/png");
              const{jsPDF}=window.jspdf;
              const W=canvas.width/2,H=canvas.height/2;
              const pdf=new jsPDF({orientation:H>W?"portrait":"landscape",unit:"px",format:[W,H]});
              pdf.addImage(imgData,"PNG",0,0,W,H);
              pdf.save(`Sanad-${ps.title.replace(/\s+/g,"-")}.pdf`);
            };
            return(
              <div style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setPreviewSanad(null)}>
                <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.55)',backdropFilter:'blur(4px)'}}/>
                <div onClick={e=>e.stopPropagation()} style={{background:'#f9fafb',borderRadius:20,width:'min(700px,97vw)',maxHeight:'93vh',overflow:'hidden',display:'flex',flexDirection:'column',position:'relative',zIndex:1,boxShadow:'0 24px 64px rgba(0,0,0,.28)'}}>
                  {/* Modal header */}
                  <div style={{padding:'14px 18px',background:'#fff',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,gap:12,flexWrap:'wrap'}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:17,fontWeight:700,color:'#111827',fontFamily:"'EB Garamond',serif",lineHeight:1.3}}>{ps.title}</div>
                      {ps.subject&&<div style={{fontSize:12,color:'#6b7280',fontFamily:'system-ui',marginTop:2}}>{ps.subject}</div>}
                    </div>
                    <div style={{display:'flex',gap:7,flexShrink:0,flexWrap:'wrap'}}>
                      <button onClick={handlePsPdf} style={{padding:'7px 14px',borderRadius:8,border:'1px solid #e5e7eb',background:'#f9fafb',color:'#374151',cursor:'pointer',fontSize:12,fontFamily:'system-ui',fontWeight:600,display:'flex',alignItems:'center',gap:5}}>
                        <svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M7.5 10L3 5.5h3V1h3v4.5h3L7.5 10Z" fill="#374151"/><path d="M1 13h13" stroke="#374151" strokeWidth="1.5" strokeLinecap="round"/></svg>PDF
                      </button>
                      <button onClick={()=>{handleLoadSanad(ps);setPreviewSanad(null);}} style={{padding:'7px 16px',borderRadius:8,border:'none',background:catObj.color,color:'#fff',cursor:'pointer',fontSize:12.5,fontFamily:'system-ui',fontWeight:600}}>
                        ✏ Load &amp; Edit
                      </button>
                      <button onClick={()=>setPreviewSanad(null)} style={{background:'#f3f4f6',border:'none',borderRadius:'50%',width:32,height:32,cursor:'pointer',fontSize:20,color:'#6b7280',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>×</button>
                    </div>
                  </div>
                  {/* Visual */}
                  <div style={{overflowY:'auto',flex:1}}>
                    <Visual rows={ps.rows} edges={psEdges} subject={ps.subject||''} design={ps.design||'flowers'} accentColor={ps.accent||'#b45309'} previewRef={psPdfRef}/>
                  </div>
                  {/* Footer info */}
                  <div style={{padding:'10px 18px',background:'#fff',borderTop:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:12,flexShrink:0,fontSize:11,color:'#9ca3af',fontFamily:'system-ui'}}>
                    <span style={{background:`${catObj.color}14`,border:`1px solid ${catObj.color}44`,color:catObj.color,borderRadius:20,padding:'2px 10px',fontWeight:600}}>{catObj.arabic&&catObj.arabic+' '}{catObj.label}</span>
                    <span>{ps.rows?.length||0} narrators</span>
                    <span>Saved {ps.date}</span>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* ── Tabs ── */}
          <div style={{background:"#fff",borderBottom:"1px solid #f3f4f6",display:"flex",justifyContent:"center"}}>
            {["build","preview","sanads"].map(t=>(

                                ):null;
                              })}
                              {sanad.rows.length>5&&<div style={{fontSize:10,color:'#9ca3af',fontFamily:'system-ui',paddingLeft:24}}>+{sanad.rows.length-5} more</div>}
                            </div>
                          )}
                          <div style={{fontSize:11.5,color:'#9ca3af',fontFamily:'system-ui',marginBottom:12,display:'flex',gap:10,alignItems:'center'}}>
                            <span>{narratorCount} narrator{narratorCount!==1?'s':''}</span>
                            <span style={{width:3,height:3,borderRadius:'50%',background:'#d1d5db',display:'inline-block'}}/>
                            <span>{sanad.date}</span>
                          </div>
                          <div style={{display:'flex',gap:7}}>
                            <button onClick={()=>setPreviewSanad(sanad)} style={{flex:1,padding:'8px',borderRadius:8,border:`1.5px solid ${catObj.color}`,background:'#fff',color:catObj.color,cursor:'pointer',fontSize:12.5,fontFamily:'system-ui',fontWeight:600,transition:'all .15s'}}>👁 Preview</button>
                            <button onClick={()=>handleLoadSanad(sanad)} style={{flex:1,padding:'8px',borderRadius:8,border:'none',background:catObj.color,color:'#fff',cursor:'pointer',fontSize:12.5,fontFamily:'system-ui',fontWeight:600,transition:'opacity .15s'}}>✏ Edit</button>
                            <button onClick={()=>handleDeleteSanad(sanad.id)} style={{padding:'8px 12px',borderRadius:8,border:'1px solid #fecaca',background:'#fef2f2',color:'#ef4444',cursor:'pointer',fontSize:12,fontFamily:'system-ui',flexShrink:0}}>✕</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </div>

          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap');
            * { box-sizing: border-box; }
            input::placeholder { color:#d1d5db!important; }
            button:hover { opacity:.84; }
            ::-webkit-scrollbar{width:4px;height:4px;}
            ::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:3px;}
            @keyframes spin{to{transform:rotate(360deg);}}
            @media(min-width:700px){
              .build-col{display:block!important;}
              .preview-col{display:block!important;}
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('chain-builder-root')).render(<App/>);
  </script>
</body>
</html>
